<style>

:root{--b:#6b0f0f;--red:#ff1e1e}
body{background:radial-gradient(ellipse at 50% 0,#2a0505 0,#0a0203 45%,#050505 100%) fixed,linear-gradient(rgba(255,30,30,.05) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(255,30,30,.05) 1px,transparent 1px) 0 0/32px 32px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3000;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 140px rgba(120,0,0,.45)}
header{background:linear-gradient(180deg,#1c0405,#0a0203);border-bottom:2px solid var(--red);box-shadow:0 2px 24px rgba(255,0,0,.45)}
.brand{display:flex;flex-direction:column;line-height:1}
h1{font-size:22px;font-weight:900;letter-spacing:.32em;color:#ff1e1e;text-shadow:0 0 10px rgba(255,0,0,.9),0 0 28px rgba(255,0,0,.5);animation:beat 1.8s infinite}
@keyframes beat{0%,100%{opacity:1}12%{opacity:.75;text-shadow:0 0 22px #f00,0 0 48px #f00}24%{opacity:1}}
.ecg{width:120px;height:24px;fill:none;stroke:#ff1e1e;stroke-width:1.6;filter:drop-shadow(0 0 3px #f00)}
.ecg polyline{stroke-dasharray:240;stroke-dashoffset:240;animation:ecg 2.4s linear infinite}
@keyframes ecg{to{stroke-dashoffset:-240}}
section{border:1px solid var(--b);border-top:2px solid var(--red);background:linear-gradient(180deg,rgba(40,4,6,.55),rgba(10,3,4,.94) 70px);box-shadow:0 0 22px rgba(255,0,0,.16),inset 0 0 30px rgba(120,0,0,.12)}
section>h2{background:linear-gradient(90deg,rgba(255,0,0,.28),transparent);color:#ff5a5a;text-shadow:0 0 6px rgba(255,0,0,.6);display:flex;justify-content:space-between;align-items:center}
.pill{background:#1a0405;border-color:#7a1010;box-shadow:0 0 8px rgba(255,0,0,.2)}
button,input,select{background:#140405;border-color:#6b0f0f}
button:hover,button[aria-pressed=true]{border-color:#ff1e1e;background:#2a0607;box-shadow:0 0 10px rgba(255,0,0,.4)}
.ev{border-bottom-color:#2a0a0a}.ev:hover{background:#2a0808}.ev.nw{background:#2a0707}
.row{border-bottom-color:#2a0a0a}.card{border-right-color:#4a0b0b}.card .n{color:#ff3b3b;text-shadow:0 0 12px rgba(255,0,0,.55)}
.lg{background:rgba(20,3,4,.94);border-color:#7a1010}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#6b0f0f}::-webkit-scrollbar-track{background:#0a0203}
@media(prefers-reduced-motion:reduce){h1{animation:none}.ecg polyline{stroke-dashoffset:0;stroke-dasharray:none}}

h1{font-size:18px}.brand{min-width:0}
header{gap:6px 12px}header #q{flex:1 1 160px;min-width:120px;max-width:260px}
.row{flex-wrap:wrap;align-items:baseline}.row span{min-width:0;overflow-wrap:anywhere}.row span:last-child{text-align:right;margin-left:auto}
.ev{white-space:normal;overflow-wrap:anywhere;word-break:break-word}.ev div{overflow-wrap:anywhere}
#detail p,#detail>div{overflow-wrap:anywhere}
section>h2{gap:8px;flex-wrap:wrap}section>h2 .lbl{text-transform:none}
.card{min-width:0;overflow-wrap:anywhere}
.leaflet-top,.leaflet-bottom{z-index:500}.lg{max-width:220px}
.leaflet-tooltip.cl{white-space:nowrap;pointer-events:none}
@media(max-width:900px){.row span:last-child{text-align:left;margin-left:0}}

.cl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;font:700 10px system-ui;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000}
.cl2{font-weight:500;color:#d9b3b3}
.cin{font-size:13px;letter-spacing:.14em;text-shadow:0 0 6px #f00,0 0 3px #000,0 0 3px #000}

main{padding:8px 8px 16px;gap:8px}
#side{overflow-y:auto;overflow-x:hidden}
#detail{flex:0 0 auto!important;max-height:240px;min-height:90px!important}
#regions,#sources{flex:none;padding-bottom:6px}
#side>h2{flex:none}
#stats{flex:none;min-height:max-content;flex-shrink:0;row-gap:0}
.card{flex:1 1 130px;padding:10px 14px 12px;line-height:1.25;border-bottom:0}
.card .lbl{display:block;margin-bottom:4px;white-space:normal}
.card .n{line-height:1.15;white-space:nowrap}
.row{padding:5px 10px;line-height:1.35;gap:4px 10px}
@media(max-width:900px){main{padding-bottom:24px}#side{overflow:visible}#detail{max-height:none}}

html,body{height:auto;min-height:100%;display:block;overflow-x:hidden}
body{background:radial-gradient(ellipse at 50% 0,#2a0505 0,#0a0203 45%,#050505 100%),#050505}
body::after{display:none}
header{position:sticky;top:0}
main{flex:none;height:max(560px,calc(100vh - 100px))}
@keyframes beat{0%,100%{opacity:1}12%{opacity:.8}24%{opacity:1}}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:8px;padding:0 8px 28px}
.mc.wide{grid-column:1/-1}.mb{overflow:auto;max-height:380px}
.br{display:grid;grid-template-columns:minmax(80px,130px) 1fr 44px;gap:8px;align-items:center;padding:4px 10px;font-size:12px}
.bt{height:8px;background:#200808}.bf{height:100%;background:var(--c,#ff1e1e)}.br b{text-align:right}
.hrs{display:flex;align-items:flex-end;gap:2px;height:110px;padding:12px 10px 4px}.hrs i{flex:1;background:#ff1e1e;opacity:.85}
.tw{overflow-x:auto}.tb{width:100%;border-collapse:collapse;font-size:12px}.tb th,.tb td{padding:6px 10px;text-align:left;border-bottom:1px solid #2a0a0a;vertical-align:top}
.tb th{color:#ff5a5a;font-size:10px;letter-spacing:.1em;text-transform:uppercase;position:sticky;top:0;background:#140405}.clk{cursor:pointer}.clk:hover{background:#2a0808}
.ab{padding:10px 14px;color:#cfc0c0;line-height:1.6;max-width:1000px}.ab p{margin:0 0 8px}

.tick{display:flex;gap:12px;align-items:center;border-top:1px solid #3a0a0a;padding-top:4px;min-width:0}
.tk{overflow:hidden;flex:1;white-space:nowrap;font:12px ui-monospace,Menlo,Consolas,monospace;color:#ffb3b3}
#tkin{display:inline-block;padding-left:100%;animation:mq var(--d,40s) linear infinite;will-change:transform}
.tk:hover #tkin{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-100%)}}
main{height:max(560px,calc(100vh - 128px))}
@media(prefers-reduced-motion:reduce){#tkin{animation:none;padding-left:0}.tk{overflow-x:auto}}

#side{overflow:hidden}#news{flex:1 1 0;min-height:120px}
#side #detail{flex:0 0 auto!important;max-height:190px;min-height:80px!important}
#nrg{padding:4px 6px}#nrg .chip{font-size:10px;padding:2px 6px;min-height:24px}
.nw2{display:block;border-left:3px solid var(--c);padding:7px 10px;border-bottom:1px solid #2a0a0a;color:var(--t);text-decoration:none}
a.nw2:hover{background:#2a0808}.nw2 b{color:var(--c);font-size:10px;letter-spacing:.08em}
.nw2 .tt{display:block;margin:2px 0;font-weight:600;overflow-wrap:anywhere;line-height:1.35}.nw2 div{color:var(--m);font-size:11px;overflow-wrap:anywhere}
@media(max-width:900px){#side{overflow:visible}#news{flex:none;max-height:60vh}#side #detail{max-height:none}}

@media(max-width:900px){
 html,body{overflow-x:hidden}
 header{position:relative;padding:6px 8px;gap:4px 8px}
 .ecg{display:none}h1{font-size:16px;letter-spacing:.22em}
 header>span,header .pill{font-size:11px}
 header #q{flex:1 1 100%;max-width:none;order:9}
 header>button{flex:1 1 22%;min-height:36px}
 .tick{order:10}
 main{display:flex!important;flex-direction:column;height:auto!important;min-height:0;padding:6px 6px 20px;gap:8px}
 #stats{order:-1}#mapS{order:0;height:62vh;min-height:340px}#side{order:1;overflow:visible!important}#feedS{order:2}
 #feed,#news{flex:none!important;max-height:60vh;min-height:0}
 #side #detail{max-height:none!important}
 #mapS>h2{flex-wrap:wrap;gap:6px}#mapS>h2 button{min-height:32px}
 .tools select,.tools input{flex:1 1 40%;min-height:36px}.tools button{min-height:32px}
 .card{flex:1 1 44%;border-right:0;border-bottom:1px solid #2a0a0a;padding:8px 10px}
 .card .n{font-size:20px}
 .lg{font-size:10px;max-width:150px;padding:4px 6px}.lg .lbl{display:none}
 .cl{font-size:9px}
 .more{grid-template-columns:1fr!important;padding:0 6px 20px}
 .mb{max-height:320px}.br{grid-template-columns:90px 1fr 36px}
 .tb{font-size:11px}.tb th,.tb td{padding:5px 6px}
 .row{padding:5px 8px}
 .ev,.nw2{padding:8px}
 *{min-width:0}
}
@media(max-width:380px){header .pill{letter-spacing:0}.card{flex-basis:100%}}
</style></head><body>
<header>
<div class="brand"><h1>REDPULSE</h1><span class="lbl">Global threat monitor</span></div><svg class="ecg" viewBox="0 0 120 24" aria-hidden="true"><polyline points="0,12 22,12 28,12 32,3 38,21 43,12 70,12 76,12 80,5 86,19 90,12 120,12"/></svg>
<span id="live" class="pill"><i class="dot"></i><span id="liveT">CONNECTING</span></span>

<button id="dm" aria-pressed="false" title="Force synthetic demo data">Demo</button>
<div class="tick" style="flex:1 1 100%"><span class="lbl" style="color:var(--red);font-weight:700">● Live updates</span><div class="tk" aria-hidden="true"><div id="tkin"></div></div></div>
</header>
<main>
<section id="feedS" aria-label="Live events"><h2><span>Live events <span id="cnt"></span></span><span id="fu" class="lbl mono" title="Next automatic refresh"></span></h2>
<div class="tools" id="types" role="group" aria-label="Type filter"></div>
<div class="tools"><select id="sev" aria-label="Minimum severity"><option value="">All severities</option><option value="critical">Critical</option><option value="high">High+</option><option value="moderate">Moderate+</option></select>
<select id="rng" aria-label="Time range"><option value="3600000">Last 1 h</option><option value="21600000" selected>Last 6 h</option><option value="86400000">Last 24 h</option><option value="0">All active</option></select>

<section id="mapS"><h2>World map <span><button id="zi" title="Center on India">India</button> <button id="zw" title="Whole world">World</button> <button id="zn" aria-pressed="true" title="Toggle danger zones: translucent areas sized by severity (critical ~400 km, high ~250 km, moderate ~120 km radius). Visual aid only, not an official hazard boundary.">Danger zones</button></span></h2><div id="map" role="application" aria-label="World map"></div></section>
<section id="side"><h2><span>Top global news <span id="nwc" class="lbl"></span></span><span id="nu" class="lbl mono" title="Next automatic refresh"></span></h2><div class="tools" id="nrg" role="group" aria-label="News region"></div><div class="scroll" id="news" aria-live="polite"></div><h2>Event details</h2><div id="detail" class="scroll"></div></section>
<section id="stats" aria-label="Statistics"></section>
</main>

const evBtn=e=>`<button class="ev" style="--c:${SEV[e.sev].c}" data-id="${esc(e.id)}"><b>${SEV[e.sev].i} ${SEV[e.sev].l}</b> · ${esc(e.type.toUpperCase())}<br>${esc(e.title)}<div class="mono">${fmt(e.ts)} · ${ago(e.ts)} · ${esc(e.source)}</div></button>`;
const tbl=(h,rows)=>rows.length?`<div class="tw"><table class="tb"><thead><tr>${h.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<p class="lbl" style="padding:10px">No data.</p>';
function renderMore(L){
 const cnt=(a,f)=>{const m=new Map();a.forEach(e=>{const k=f(e);m.set(k,(m.get(k)||0)+1)});return[...m]};
 const now=Date.now(),hrs=Array(24).fill(0);L.forEach(e=>{const h=Math.floor((now-e.ts)/36e5);if(h>=0&&h<24)hrs[h]++});const mx=Math.max(1,...hrs);
 const hrC=`<div class="hrs">${hrs.slice().reverse().map((v,i)=>`<i title="${23-i}-${24-i}h ago: ${v}" style="height:${Math.max(2,v/mx*100)}%"></i>`).join('')}</div><div class="row"><span>24 h ago</span><span>now (peak ${mx}/h)</span></div>`;
 const eq=L.filter(e=>e.type==='earthquake').map(e=>({e,m:+(/^M([\d.]+)/.exec(e.title)||[])[1]})).filter(x=>x.m>=0);
 const mb=[['< M3',0,3],['M3–4',3,4],['M4–5',4,5],['M5–6',5,6],['M6–7',6,7],['M7+',7,99]].map(b=>[b[0],eq.filter(x=>x.m>=b[1]&&x.m<b[2]).length]);
 const cm=new Map();L.forEach(e=>{if(!e.country)return;const o=cm.get(e.country)||{n:0,r:-1,t:0};o.n++;o.r=Math.max(o.r,SEV[e.sev].r);o.t=Math.max(o.t,e.ts);cm.set(e.country,o)});
 const cr=[...cm].sort((a,b)=>b[1].n-a[1].n).slice(0,15).map(([k,o])=>{const s=Object.values(SEV).find(x=>x.r===o.r);return`<tr><td>${esc(k)}</td><td class="mono">${o.n}</td><td>${s.i} ${s.l}</td><td class="mono">${ago(o.t)}</td></tr>`});
 const hi=L.filter(e=>e.sev==='critical'||e.sev==='high').sort((a,b)=>b.ts-a.ts).slice(0,10).map(evBtn).join('')||'<p class="lbl" style="padding:10px">No critical or high events.</p>';
 const big=eq.sort((a,b)=>b.m-a.m).slice(0,8).map(x=>evBtn(x.e)).join('')||'<p class="lbl" style="padding:10px">No earthquakes loaded.</p>';
 const md=L.filter(e=>e.source.startsWith('GDELT')).sort((a,b)=>(b.n||0)-(a.n||0)).slice(0,12).map(e=>`<tr data-id="${esc(e.id)}" class="clk"><td>${esc(e.title.replace(' reports — ',' · '))}</td><td class="mono">${e.n||'—'}</td><td class="mono">${ago(e.ts)}</td></tr>`);
 const sr=[...SRC,...NSRC].map(x=>`<tr><td>${x.name} <small>${x.kind}</small></td><td>${x.st==='ok'?'● CONNECTED'+(x.via==='relay'?' (relay)':''):x.st==='error'?'✕ OFFLINE':'… CONNECTING'}</td><td class="mono">${x.ev.length}</td><td class="mono">${x.every/1000}s</td><td class="mono">${x.last?ago(x.last):'—'}</td><td class="mono">${x.at?Math.max(0,Math.round((x.at-now)/1000))+'s':'—'}</td><td>${esc(x.err||'—')}</td></tr>`);
 const about=`<div class="ab"><p><b>Global alert level</b> is an interface aggregation of loaded events: CRITICAL if any critical event exists, HIGH if 5 or more high events, ELEVATED if any high event, otherwise NORMAL. It is not an official risk rating.</p>
<p><b>Severity rules.</b> USGS earthquakes: M7+ critical, M6+ high, M4.5+ moderate, below that low. NASA EONET: volcanoes high, storms/fires/floods moderate, other low. GDELT media reports: 15+ articles critical, 3+ high, otherwise moderate, based only on how many news items name the place.</p>
<p><b>Data status.</b> VERIFIED SOURCE = reviewed by the publishing agency. PRELIMINARY = automatic, may be revised. UNVERIFIED = aggregated or media-derived, not confirmed. DEMO / SIMULATED = synthetic sample data shown only when no live source is reachable.</p>
<p><b>Live sources.</b> USGS (earthquakes), NASA EONET (natural events), GDACS (UN/EC disaster alerts), NOAA NWS (US severe weather), OpenSky (aircraft emergency transponder codes 7500/7600/7700), wheretheiss.at (ISS position), GDELT (media reports and headlines), Wikipedia Current events, NOAA SWPC (space weather). Each is requested directly from your browser on its own schedule and nothing is saved: no cookies, local storage or database, and old items are dropped when sources stop returning them.</p>
<p><b>Relay.</b> Some providers block requests made directly from a web page. When that happens and Relay is on, the page retries through a public CORS relay (allorigins.win or corsproxy.io); those services can see which public data URLs you ask for. Sources fetched that way show "(relay)". Switch Relay off in the top bar to use direct requests only.</p>
<p><b>Top global news</b> combines Wikipedia's editor-curated Current events portal (sports and arts hidden; each item names its original outlet) with automatically selected English-language headlines from GDELT. Regions are guessed from country names in the headline, so some items show as Global. Treat media headlines as unverified.</p>
<p><b>Time.</b> Source timestamps are kept as published and shown in the zone labelled next to them (toggle UTC / Local in the top bar). GDELT items have no event time, so the time shown is when this page first saw them.</p>
<p><b>Nothing is saved.</b> No cookies, local storage or server are used; all data lives in memory and disappears when you close the page.</p>
<p><b>Limits.</b> This is a monitoring interface, not an authority. Media-derived markers can be wrong, duplicated or mis-located. Country shapes use Natural Earth boundaries (India perspective), simplified for speed. Danger zones on the map are a visual aid only. Statistics below follow your current filters and search.</p></div>`;
 $('#more').innerHTML=card('Severity distribution',bars(Object.keys(SEV).map(k=>[SEV[k].i+' '+SEV[k].l,L.filter(e=>e.sev===k).length,SEV[k].c])))+
 card('Event types',bars(cnt(L,e=>e.type).sort((a,b)=>b[1]-a[1]).map(r=>[r[0].toUpperCase(),r[1]])))+
 card('Regions',bars(REGIONS.map(r=>[r,L.filter(e=>e.region===r).length])))+
 card('Data status',bars(cnt(L,e=>e.status).sort((a,b)=>b[1]-a[1])))+
 card('Earthquake magnitudes',bars(mb))+
 card('Activity, last 24 hours',hrC)+
 card('Latest critical &amp; high events','<div>'+hi+'</div>')+
 card('Strongest earthquakes','<div>'+big+'</div>')+
 card('Top countries by events',tbl(['Country','Events','Worst','Latest'],cr))+
 card('Media-reported incidents (unverified)',tbl(['Report','Articles','First seen'],md))+
 card('Live update log (this session only)',tbl(['Time (UTC)','Source','Update'],S.log.slice(0,40).map(x=>`<tr><td class="mono">${new Date(x.t).toISOString().slice(11,19)}</td><td>${esc(x.src)}</td><td>${esc(x.msg)}</td></tr>`)),1)+
 card('Data source health',tbl(['Source','Status','Events','Interval','Last OK','Next','Error'],sr),1)+
 card('About this data',about,1)}
function drawMap(list){
 if(!layer)return;const sig=S.zones+'|'+list.slice(0,800).map(e=>e.id+e.sev).join(',');if(sig===drawMap.sig)return;drawMap.sig=sig;layer.clearLayers();
 if(S.zones)list.slice(0,300).forEach(e=>{const m={critical:4e5,high:25e4,moderate:12e4}[e.sev];if(m)L.circle([e.lat,e.lon],{radius:m,stroke:false,fillColor:SEV[e.sev].c,fillOpacity:e.sev==='critical'?.2:.1,interactive:false}).addTo(layer)});
 list.filter(e=>e.sev==='critical').slice(0,15).forEach(e=>L.marker([e.lat,e.lon],{interactive:false,keyboard:false,icon:L.divIcon({className:'',html:'<div class="pk"></div>',iconSize:[18,18]})}).addTo(layer));
 list.slice(0,800).forEach(e=>{const c=SEV[e.sev];
  L.circleMarker([e.lat,e.lon],{radius:3+c.r*2,color:c.c,weight:1,fillColor:c.c,fillOpacity:.45})
   .bindTooltip(esc(c.l+' · '+e.title)).on('click',()=>select(e.id)).addTo(layer)})
}
function select(id,fly){S.sel=id;const e=lastAll.find(x=>x.id===id);renderDetail(e);if(fly&&map&&e)map.flyTo([e.lat,e.lon],5)}
function renderDetail(e){const el=$('#detail');
 if(!e){el.innerHTML='<p class="lbl" style="padding:10px">Select an event on the map or in the feed.</p>';return}
 const c=SEV[e.sev],r=(k,v)=>`<div class="row"><span>${k}</span><span class="mono">${esc(v)}</span></div>`;
 el.innerHTML=`<div style="padding:8px 10px;border-left:3px solid ${c.c}"><b style="color:${c.c}">${c.i} ${c.l}</b> · ${esc(e.type.toUpperCase())}<br>${esc(e.title)}</div>`+
 r('Location',e.country||'—')+r('Region',e.region)+r('Latitude',e.lat.toFixed(3)+'°')+r('Longitude',e.lon.toFixed(3)+'°')+r('Event time',fmt(e.ts))+r('Source updated',fmt(e.upd))+
 r('Source',e.source)+r('Data status',e.status)+r('ID',e.id)+`<p style="padding:4px 10px;color:var(--m)">${esc(e.desc)}</p>`+
 `<div class="tools">${/^https:\/\//.test(e.url)?`<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer"><button>Open source</button></a>`:''}<button id="vm">View on map</button></div>`;
 const b=$('#vm');if(b)b.onclick=()=>map&&map.flyTo([e.lat,e.lon],5)}

function render(){
 const all=events().map(e=>({...e,region:region(e.lat,e.lon),country:countryOf(e.lat,e.lon)||e.country}));
 const list=visible(all);
 const ids=new Set(all.map(e=>e.id)),now=Date.now();
 all.forEach(e=>{if(!S.fs.has(e.id))S.fs.set(e.id,S.first?0:now)});
 S.fs.forEach((v,k)=>{if(!ids.has(k))S.fs.delete(k)});S.seen.forEach(k=>{if(!ids.has(k))S.seen.delete(k)});
 if(CC.size>1000)CC.clear();
 // feed
 const nn=SRC.reduce((a,x)=>a+(x.newN||0),0);$('#cnt').textContent='('+list.length+')'+(nn?' +'+nn+' new':'');
 $('#feed').innerHTML=list.length?list.slice(0,200).map(e=>{const c=SEV[e.sev];
  const nw=S.fs.get(e.id)>0&&now-S.fs.get(e.id)<3e4;
  return`<button class="ev${nw?' nw':''}" style="--c:${c.c}" data-id="${esc(e.id)}"><b>${c.i} ${c.l}</b> · ${esc(e.type.toUpperCase())}<br>${esc(e.title)}<div class="mono">${fmt(e.ts)} · ${ago(e.ts)} · ${esc(e.source)} · ${esc(e.status)}</div></button>`}).join(''):'<p class="lbl" style="padding:14px">No events in this time range or filter. Widen the time range above.</p>';
 lastAll=all;drawMap(list);renderMore(list);renderNews();
 // stats
 const cnt=k=>all.filter(e=>e.sev===k).length,d24=all.filter(e=>e.ts>Date.now()-864e5).length;
 const cards=[['Active events',all.length],['Critical',cnt('critical')],['High',cnt('high')],['Moderate',cnt('moderate')],['Low',cnt('low')],['Countries affected',new Set(all.map(e=>e.country).filter(Boolean)).size],['Last 24h',d24],['Sources online',online()+' / '+SRC.length]];
 $('#stats').innerHTML=cards.map(c=>`<div class="card"><div class="lbl">${c[0]}</div><div class="n mono">${c[1]}</div></div>`).join('');
 // alert level
 const cr=cnt('critical'),hi=cnt('high'),lv=cr?['CRITICAL','--red']:hi>=5?['HIGH','--org']:hi?['ELEVATED','--yel']:['NORMAL','--grn'];
 const al=$('#alert');al.textContent='● '+lv[0];al.style.color=`var(${lv[1]})`;al.style.borderColor=`var(${lv[1]})`;
 // regions
 $('#regions').innerHTML=REGIONS.map(r=>{const x=all.filter(e=>e.region===r),l=x.sort((a,b)=>b.ts-a.ts)[0];
  return`<div class="row reg" tabindex="0" role="button" aria-pressed="${S.region===r}" data-r="${r}" style="${S.region===r?'background:#1a0808':''}"><span>${r}</span><span class="mono">${x.length} / ${x.filter(e=>e.sev==='critical').length}crit${l?' · '+ago(l.ts):''}</span></div>`}).join('');
 // sources
 $('#sources').innerHTML=[...SRC,...NSRC].map(s=>`<div class="row"><span>${s.st==='ok'?'●':s.st==='error'?'✕':'…'} ${s.name} <small>${s.kind}</small></span><span class="mono">${s.st==='ok'?'CONNECTED'+(s.via==='relay'?' (relay)':'')+' · '+s.ev.length+' ev · '+ago(s.last)+' · /'+s.every/1000+'s':s.st==='error'?'OFFLINE ('+esc(s.err)+') retry '+Math.round((s.next||0)/1000)+'s'+(s.last?' · last ok '+ago(s.last):''):'CONNECTING'}</span></div>`).join('');
 // header status
 const demo=isDemo(),on=online(),lv2=$('#live');
 lv2.className='pill '+(on&&!demo?'live':'off');
 $('#liveT').textContent=navigator.onLine===false?'NO INTERNET · RETRYING':demo?(S.demo?'DEMO':'SOURCES OFFLINE'):on<SRC.length?'LIVE (PARTIAL)':'LIVE · STREAM CONNECTED';
 $('#demoB').style.display=demo?'':'none';
 const lt=Math.max(0,...SRC.map(s=>s.last));$('#last').textContent=lt?new Date(lt).toISOString().slice(11,19)+' UTC':'—';
 if(S.sel)renderDetail(all.find(e=>e.id===S.sel));
 // notifications
 if(!demo)all.filter(e=>e.sev==='critical'&&!S.seen.has(e.id)).forEach(e=>{S.seen.add(e.id);if(!S.first)notify(e)});
 if(!demo&&on)S.first=false;
}
function notify(e){if(Date.now()-S.lastNote<6e4)return;S.lastNote=Date.now();
 if(S.notify&&window.Notification&&Notification.permission==='granted')new Notification('CRITICAL EVENT DETECTED',{body:e.title+' ('+e.source+')'});
 if(S.sound)try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.onended=()=>a.close();o.start();o.stop(a.currentTime+.25)}catch{}}
const refresh=()=>requestAnimationFrame(render);

// UI wiring (single set of listeners)
$('#types').innerHTML=TYPES.map(t=>`<button class="chip" data-t="${t}" aria-pressed="${t==='all'}">${t}</button>`).join('');
$('#types').onclick=e=>{const t=e.target.dataset.t;if(!t)return;S.type=t;document.querySelectorAll('#types button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));render()};
$('#feed').onclick=e=>{const b=e.target.closest('[data-id]');if(b)select(b.dataset.id,true)};
$('#regions').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;S.region=S.region===b.dataset.r?'':b.dataset.r;render()};
$('#regions').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}};
$('#sev').onchange=e=>{S.sev=e.target.value;render()};
$('#rng').onchange=e=>{S.rng=+e.target.value;render()};
$('#sort').onchange=e=>{S.sort=e.target.value;render()};
let dt;$('#q').oninput=e=>{clearTimeout(dt);dt=setTimeout(()=>{S.q=e.target.value.trim();render()},200)};
const tog=(id,k,txt,after)=>{$(id).onclick=function(){S[k]=!S[k];this.setAttribute('aria-pressed',S[k]);if(txt)this.textContent=txt(S[k]);after&&after();render()}};
tog('#tz','utc',v=>v?'UTC':'Local');$('#tz').setAttribute('aria-pressed','true');
tog('#snd','sound',v=>'Sound: '+(v?'on':'off'));
tog('#dm','demo');tog('#rl','relay',v=>'Relay: '+(v?'on':'off'));tog('#zn','zones');
tog('#ntf','notify',v=>'Notify: '+(v?'on':'off'),()=>{if(S.notify&&window.Notification&&Notification.permission==='default')Notification.requestPermission();if(!window.Notification)S.notify=false});
const cd=a=>{const t=Math.min(...a.map(x=>x.at||Infinity));return document.hidden?'paused':isFinite(t)?'↻ '+Math.max(0,Math.round((t-Date.now())/1000))+'s':''};
const T1=setInterval(()=>{$('#fu').textContent=cd(SRC);$('#nu').textContent=cd(NSRC);const n=new Date();const at=Math.min(...[...SRC,...NSRC].map(x=>x.at||Infinity));$('#nxt').textContent=document.hidden?'paused':isFinite(at)?Math.max(0,Math.round((at-Date.now())/1000))+'s':'—';$('#utc').textContent=n.toISOString().slice(11,19);$('#loc').textContent=n.toLocaleTimeString([], {hour12:false})},1000);
const T2=setInterval(()=>{if(!document.hidden)render()},30e3);
addEventListener('online',()=>[...SRC,...NSRC].forEach(x=>{clearTimeout(x.t);setTimeout(()=>poll(x),x.delay||0)}));addEventListener('offline',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)[...SRC,...NSRC].forEach(x=>{clearTimeout(x.t);setTimeout(()=>poll(x),x.delay||0)})});
addEventListener('pagehide',()=>{clearInterval(T1);clearInterval(T2);RO&&RO.disconnect();[...SRC,...NSRC].forEach(x=>clearTimeout(x.t))}); // refresh relative times and source countdowns

$('#more').onclick=e=>{const b=e.target.closest('[data-id]');if(b){select(b.dataset.id,true);scrollTo({top:0,behavior:'smooth'})}};
tick();initMap();$('#zi').onclick=()=>fitIndia(true);$('#zw').onclick=()=>map&&map.flyTo([20,10],2);renderDetail();[...SRC,...NSRC].forEach(x=>setTimeout(()=>poll(x),x.delay||0));render();
</script></body></html>
